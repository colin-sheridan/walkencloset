<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f1df">
  <meta name="description" content="A very ordinary bedroom. An extraordinarily Walken closet. A tiny, silly internet toy.">
  <title>The Walken Closet</title>
  <link rel="stylesheet" href="styles.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main>
    <header class="masthead"><a class="wordmark" href="./">WC<span>®</span></a><span>What The Crap Was I Thinking...</span><span class="edition">EST. 2026</span></header>
    <section class="intro" aria-labelledby="title">
      <h1 id="title">The <em>Walken</em> Closet<span class="title-star" aria-hidden="true"></span></h1>
      <div class="counter" aria-live="polite" aria-atomic="true"><span>Walkens in Closet:</span><strong id="count">0</strong><span class="capacity">CAPACITY: QUESTIONABLE</span></div>
    </section>
    <section class="game" aria-label="Cartoon bedroom">

      <div class="room" id="room">
        <svg class="bedroom" viewBox="0 0 1000 580" aria-hidden="true">
          <defs>
            <pattern id="wallpaper" width="44" height="44" patternUnits="userSpaceOnUse"><rect width="44" height="44" fill="#e7e9c8"/><path d="M22 18v8m-4-4h8" stroke="#ccd0ad" stroke-width="1.5"/></pattern>
            <pattern id="floor" width="120" height="48" patternUnits="userSpaceOnUse"><rect width="120" height="48" fill="#d9a67c"/><path d="M0 0h120M0 48h120M60 0v48" fill="none" stroke="#ae7c5d" stroke-width="2"/><path d="M8 12h38m28 20h31" stroke="#c18b65" stroke-width="2"/></pattern>
          </defs>
          <path d="M0 0h1000v407H0z" fill="url(#wallpaper)"/>
          <path d="M0 407h1000v173H0z" fill="url(#floor)"/>
          <path d="M0 393h1000v17H0z" fill="#f6edcf" stroke="#343b31" stroke-width="3"/>
          <path d="M0 28h1000" stroke="#bcc39f" stroke-width="3"/>
          <!-- A sunny window, complete with wonky curtains. -->
          <g stroke="#343b31" stroke-width="4" stroke-linejoin="round">
            <rect x="69" y="72" width="196" height="195" rx="2" fill="#f8f0d3"/>
            <rect x="80" y="83" width="174" height="173" fill="#abd1d2"/>
            <circle cx="206" cy="124" r="24" fill="#f6ce65" stroke="none"/>
            <path d="M82 218q40-60 88-4t84-5v46H82" fill="#a5b98c" stroke="none"/>
            <path d="M167 83v173M80 169h174" fill="none"/>
            <path d="M54 63h225" stroke-width="7"/>
            <path d="M60 66h48l-7 143-20-26-20 21zM226 66h47l1 138-20-20-22 24z" fill="#dd8069"/>
            <path d="M75 69l-2 103m17-103-4 105m155-105 3 105m15-105 3 104" stroke="#bb6654" stroke-width="2"/>
            <path d="M66 265h202v10H66z" fill="#f8f0d3"/>
          </g>
          <!-- Framed bedroom wisdom. -->
          <g transform="rotate(-5 420 142)" stroke="#343b31" stroke-width="4"><rect x="359" y="88" width="123" height="119" fill="#af7958"/><rect x="368" y="97" width="105" height="101" fill="#f7edce" stroke-width="2"/></g>
          <text x="420" y="129" text-anchor="middle" transform="rotate(-5 420 142)" fill="#343b31" font-family="Georgia,serif" font-size="18" font-weight="bold"><tspan x="420">HOME</tspan><tspan x="420" dy="23">SWEET</tspan><tspan x="420" dy="23">HOME.</tspan></text>
          <!-- Bed and a nightstand. -->
          <ellipse cx="228" cy="469" rx="209" ry="30" fill="#996a50" opacity=".22"/>
          <g stroke="#343b31" stroke-width="4" stroke-linejoin="round">
            <path d="M20 312q0-18 18-18h40q17 0 17 18v163H20z" fill="#b77d58"/>
            <path d="M43 322v122M70 322v122" fill="none" stroke="#925f42" stroke-width="2"/>
            <path d="M49 378h281l54 50H49z" fill="#fff5d9"/>
            <path d="M87 354q30-10 56 4l13 30H80z" fill="#fff9e8"/>
            <path d="M156 374h166l61 48v27H153z" fill="#d77b65"/>
            <path d="M174 381v61m29-61v61m29-61v61m29-61v61m29-61v61m29-59 22 59m-183-37h191m-191 20h214" stroke="#f0ad8b" stroke-width="2"/>
            <path d="M49 427h339v23H49zM55 450v29h17v-29m284 0v29h17v-29" fill="#b77d58"/>
            <path d="M373 392h72v65h-72z" fill="#b77d58"/><path d="M366 383h86v13h-86z" fill="#f5dfb2"/>
            <path d="M382 405h54v25h-54z" fill="#cc946b"/><circle cx="409" cy="417" r="2"/>
            <path d="M411 383v-43m-16 43h32" fill="none"/>
            <path d="M395 303h31l14 40h-59z" fill="#e9c65b"/>
          </g>
          <!-- An optimistic rug. -->
          <ellipse cx="636" cy="493" rx="170" ry="48" fill="#e1c575" stroke="#343b31" stroke-width="3"/>
          <ellipse cx="636" cy="493" rx="151" ry="35" fill="none" stroke="#a79c58" stroke-width="3" stroke-dasharray="8 5"/>
          <path d="M941 401v-69m-1 28q-35-2-28-28 28-1 28 28m2-12q26-4 27-29-29 1-27 29" fill="#8ba477" stroke="#343b31" stroke-width="3"/>
          <path d="M920 384h43l-7 39h-29z" fill="#d47e64" stroke="#343b31" stroke-width="3"/>
        </svg>
        <div class="closet-shell" id="closet-shell">
          <div class="closet-inside"><div class="rail"></div><span class="hanger">♧</span><span class="inside-eyes">••</span></div>
          <button id="closet" class="closet-door" aria-label="Open the closet and let Christopher Walken in" aria-describedby="hint"><span class="door-panel top-panel"></span><span class="door-panel bottom-panel"></span><span class="door-knob"></span></button>
          <span class="closet-pediment"></span>
        </div>
        <div id="walken" class="walken"><img src="assets/walken.png" alt="Christopher Walken" draggable="false"></div>
        <div class="click-note" id="hint">click the closet<span aria-hidden="true">↙</span></div>
        <span class="speech" id="speech" aria-hidden="true">Well, hello.</span>
      </div>
    </section>
    <footer><span>A SMALL TRIBUTE TO THE WEIRD OLD WEB.</span><span>No Flash. Just a little flair. <a href="https://colinsheridan.dev" aria-label="Visit Colin Sheridan’s website"><span aria-hidden="true">↗</span></a></span></footer>
    <noscript><p>Please enable JavaScript to let Christopher into the closet.</p></noscript>
  </main>
</body>
</html>
